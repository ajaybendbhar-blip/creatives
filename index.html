<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #1f2937;
    }
    .wrap {
      max-width: 1280px;
      margin: 0 auto;
    }
    .panel {
      background: #fff;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      margin-bottom: 18px;
    }
    h1 { margin: 0 0 8px 0; }
    .small { color: #6b7280; font-size: 13px; line-height: 1.5; }
    label {
      display: block;
      margin-top: 10px;
      font-weight: 700;
      font-size: 14px;
    }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      margin-top: 6px;
      margin-bottom: 12px;
      padding: 10px;
      border: 1px solid #d7dbe7;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }
    textarea { min-height: 90px; resize: vertical; }
    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: #1a73e8;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      margin-right: 8px;
      margin-top: 4px;
    }
    button.secondary { background: #5f6368; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .status {
      margin-top: 12px;
      color: #0b57d0;
      font-size: 14px;
      white-space: pre-wrap;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
    }
    .rowcard {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 12px;
      background: #fff;
    }
    .rowtop {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }
    .rowtitle {
      font-weight: 800;
      font-size: 16px;
    }
    .rowsub {
      font-size: 13px;
      color: #6b7280;
      margin-top: 2px;
      line-height: 1.4;
    }
    .poster {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      background: #111;
      color: #fff;
      border-radius: 14px;
      transform: scale(0.28);
      transform-origin: top left;
      margin-bottom: -972px;
    }
    .bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: brightness(0.94);
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.08), rgba(0,0,0,0.66));
    }
    .strip {
      position: absolute;
      left: 40px;
      right: 40px;
      bottom: 40px;
      background: rgba(0,0,0,0.82);
      border: 2px solid rgba(255,255,255,0.16);
      border-radius: 18px;
      padding: 28px;
    }
    .dealer-name {
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 10px;
      line-height: 1.1;
    }
    .line {
      font-size: 22px;
      line-height: 1.45;
      margin-bottom: 4px;
    }
    .contact, .gmb {
      margin-top: 8px;
      font-size: 18px;
      opacity: 0.92;
      word-break: break-word;
    }
    .copybox {
      position: absolute;
      top: 60px;
      left: 60px;
      right: 60px;
      font-size: 34px;
      line-height: 1.2;
      font-weight: 700;
      text-align: center;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h1>DSP Poster Generator</h1>
      <div class="small">
        Upload one campaign image, select branches, then generate PNG posters.
        Each output is saved to Drive and the URL is written back to your sheet.
      </div>

      <label>Campaign Image</label>
      <input type="file" id="imageFile" accept="image/*" />

      <label>Approved Copy</label>
      <textarea id="approvedCopy" placeholder="Paste approved copy here"></textarea>

      <div style="margin-top:10px;">
        <button onclick="loadRows()">Load Branches</button>
        <button class="secondary" onclick="selectAll(true)">Select All</button>
        <button class="secondary" onclick="selectAll(false)">Clear All</button>
        <button onclick="generateSelected()">Generate Selected</button>
      </div>

      <div id="status" class="status"></div>
    </div>

    <div class="panel">
      <div id="branchList" class="grid"></div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyP5NJWxJ4VT6UW2qkRROILAr7maCl5ANV-u8-d9Wk8dz2Vklbu7fsL4gEHOjItyz9W/exec';
    let rows = [];
    let campaignDataUrl = '';

    document.getElementById('imageFile').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      campaignDataUrl = await fileToDataUrl(file);
      setStatus('Campaign image loaded.');
    });

    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    function googleRun(method, args = []) {
      return new Promise((resolve, reject) => {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](...args);
      });
    }

    async function loadRows() {
      try {
        setStatus('Loading branches from sheet...');
        const res = await fetch(SCRIPT_URL + '?action=getRows');
        const data = await res.json();
        rows = data.rows || [];
        renderRows();
        setStatus(`Loaded ${rows.length} branches.`);
      } catch (err) {
        setStatus('Error loading rows: ' + (err.message || err));
      }
    }

    function renderRows() {
      const list = document.getElementById('branchList');
      list.innerHTML = '';
      if (!rows.length) {
        list.innerHTML = '<div class="rowcard">No rows found.</div>';
        return;
      }

      rows.forEach((row, i) => {
        const card = document.createElement('div');
        card.className = 'rowcard';
        card.dataset.idx = i;
        card.innerHTML = `
          <div class="rowtop">
            <input type="checkbox" class="sel" checked>
            <div>
              <div class="rowtitle">${escapeHtml(row['Dealership Name'] || '')}</div>
              <div class="rowsub">${escapeHtml([row['DSP Address'], row['LOCATION'], row['City'], row['State']].filter(Boolean).join(', '))}</div>
            </div>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function selectAll(val) {
      document.querySelectorAll('.sel').forEach(chk => chk.checked = val);
    }

    function selectedRows() {
      const cards = [...document.querySelectorAll('.rowcard')];
      return cards
        .map((card, idx) => ({ card, row: rows[idx], selected: card.querySelector('.sel').checked }))
        .filter(x => x.selected);
    }

    async function generateSelected() {
      if (!campaignDataUrl) {
        setStatus('Please upload the campaign image first.');
        return;
      }
      const copy = document.getElementById('approvedCopy').value.trim();
      if (!copy) {
        setStatus('Please paste approved copy.');
        return;
      }

      const targets = selectedRows();
      if (!targets.length) {
        setStatus('No branches selected.');
        return;
      }

      setStatus(`Generating ${targets.length} posters...`);
      for (let i = 0; i < targets.length; i++) {
        const row = targets[i].row;
        const poster = buildPoster(row, campaignDataUrl, copy);
        const canvas = await html2canvas(poster, { useCORS: true, scale: 2, backgroundColor: null });
        const dataUrl = canvas.toDataURL('image/png');
        const fileName = sanitize(row['Dealership Name'] || `poster_${i + 1}`) + '.png';

        const resp = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'savePoster',
            dataUrl,
            fileName,
            mimeType: 'image/png',
            rowNumber: row.__rowNumber
          })
        });
        await resp.text();

        document.body.removeChild(poster);
        setStatus(`Generated ${i + 1} / ${targets.length} : ${row['Dealership Name'] || ''}`);
      }

      setStatus('Done. Files saved to Drive and URLs written back to the sheet.');
    }

    function buildPoster(row, bgUrl, copyText) {
      const el = document.createElement('div');
      el.className = 'poster';
      el.innerHTML = `
        <div class="bg" style="background-image:url('${bgUrl}')"></div>
        <div class="overlay"></div>
        <div class="copybox">${escapeHtml(copyText)}</div>
        <div class="strip">
          <div class="dealer-name">${escapeHtml(row['Dealership Name'] || '')}</div>
          <div class="line">${escapeHtml(row['DSP Address'] || '')}</div>
          <div class="line">${escapeHtml([row['LOCATION'], row['City'], row['State']].filter(Boolean).join(', '))}</div>
          <div class="contact">Owner No: ${escapeHtml(row['Owner No'] || '')} | Alternate No: ${escapeHtml(row['Alternate no'] || '')}</div>
          <div class="gmb">GMB: ${escapeHtml(row['GMB_URL'] || '')}</div>
        </div>
      `;
      document.body.appendChild(el);
      el.style.position = 'fixed';
      el.style.left = '-99999px';
      return el;
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onload = () => resolve(fr.result);
        fr.onerror = reject;
        fr.readAsDataURL(file);
      });
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function sanitize(name) {
      return String(name || '')
        .trim()
        .replace(/[\\\/:*?"<>|]+/g, '_')
        .replace(/\s+/g, '_')
        .substring(0, 120);
    }
  </script>
</body>
</html>
