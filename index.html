<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSP Poster Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #1a73e8;
      --border: #d7dbe7;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap { max-width: 1280px; margin: 0 auto; padding: 20px; }
    .panel {
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      margin-bottom: 18px;
    }
    h1 { margin: 0 0 8px 0; }
    .small { color: var(--muted); font-size: 13px; line-height: 1.5; }
    label { display:block; margin-top:10px; font-weight:700; font-size:14px; }
    input {
      width:100%; box-sizing:border-box; margin-top:6px; margin-bottom:12px;
      padding:10px; border:1px solid var(--border); border-radius:10px;
      font-size:14px; outline:none; background:#fff;
    }
    button {
      padding:12px 16px; border:0; border-radius:10px; background:var(--primary); color:#fff;
      font-weight:700; cursor:pointer; margin-right:8px; margin-top:4px;
    }
    button.secondary { background:#5f6368; }
    .status { margin-top:12px; color:#0b57d0; font-size:14px; white-space:pre-wrap; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:16px; }
    .rowcard { border:1px solid #e5e7eb; border-radius:14px; padding:12px; background:#fff; }
    .rowtop { display:flex; align-items:flex-start; gap:10px; margin-bottom:10px; }
    .rowtitle { font-weight:800; font-size:16px; }
    .rowsub { font-size:13px; color:#6b7280; margin-top:2px; line-height:1.4; }

    .previewwrap {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .previewbox {
      overflow: auto;
      border-radius: 12px;
      border: 1px solid #dbe2ea;
      background: #fff;
      padding: 10px;
    }

    .poster {
      position: relative;
      display: inline-block;
      background: #fff;
      color: #000;
      overflow: hidden;
    }

    .poster img {
      display: block;
      width: 100%;
      height: auto;
    }

    .footer {
      background: #ffffff;
      color: #000000;
      border-top: 1px solid #e5e7eb;
      box-sizing: border-box;
      padding: 18px 24px 16px 24px;
      width: 100%;
      min-height: 240px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }

    .footer-left {
      flex: 1;
      min-width: 0;
    }

    .footer-right {
      width: 145px;
      flex: 0 0 145px;
      text-align: center;
    }

    .qr-box {
      width: 128px;
      height: 128px;
      margin: 0 auto 6px auto;
      background: #fff;
      border: 1px solid #e5e7eb;
      padding: 6px;
      box-sizing: border-box;
    }

    .qr-label {
      font-size: 13px;
      font-weight: 700;
      color: #000;
      line-height: 1.3;
    }

    .dealer-name {
      font-size: 34px;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 8px;
      color: #000;
      word-break: break-word;
    }

    .line {
      font-size: 19px;
      line-height: 1.38;
      margin-bottom: 4px;
      color: #000;
      word-break: break-word;
    }

    .contact {
      margin-top: 8px;
      font-size: 18px;
      line-height: 1.35;
      color: #000;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h1>DSP Poster Generator</h1>
      <div class="small">
        Upload one campaign image, select branches, then generate posters.
        The original artwork is preserved as-is and the white dealer strip includes a QR code.
      </div>

      <label>Campaign Image</label>
      <input type="file" id="imageFile" accept="image/*" />

      <div style="margin-top:10px;">
        <button onclick="loadRows()">Load Branches</button>
        <button class="secondary" onclick="selectAll(true)">Select All</button>
        <button class="secondary" onclick="selectAll(false)">Clear All</button>
        <button onclick="generateSelected()">Generate Selected</button>
      </div>

      <div id="status" class="status"></div>
    </div>

    <div class="panel">
      <div id="branchList" class="grid"></div>
    </div>

    <div class="panel">
      <div class="small">Preview</div>
      <div id="previewArea" class="previewwrap"></div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx3_P5vGKx8DYbOxv6pqxNl3TgUHrHlrfMHusl36zm4LE9X5KnHlFVm88cFomVCC9lY/exec';
    let rows = [];
    let campaignDataUrl = '';

    document.getElementById('imageFile').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      campaignDataUrl = await fileToDataUrl(file);
      setStatus('Campaign image loaded.');
      if (rows.length) renderPreviewRows();
    });

    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    async function loadRows() {
      try {
        setStatus('Loading branches from sheet...');
        const res = await fetch(SCRIPT_URL + '?action=getRows');
        const text = await res.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          console.error('Non-JSON response:', text);
          throw new Error('Backend did not return JSON for getRows');
        }
        rows = data.rows || [];
        renderRows();
        setStatus(`Loaded ${rows.length} branches.`);
        renderPreviewRows();
      } catch (err) {
        setStatus('Error loading rows: ' + (err.message || err));
      }
    }

    function renderRows() {
      const list = document.getElementById('branchList');
      list.innerHTML = '';
      if (!rows.length) {
        list.innerHTML = '<div class="rowcard">No rows found.</div>';
        return;
      }

      rows.forEach((row, i) => {
        const card = document.createElement('div');
        card.className = 'rowcard';
        card.dataset.idx = i;
        card.innerHTML = `
          <div class="rowtop">
            <input type="checkbox" class="sel" checked>
            <div>
              <div class="rowtitle">${escapeHtml(row['Dealership Name'] || '')}</div>
              <div class="rowsub">${escapeHtml([row['DSP Address'], row['LOCATION'], row['City'], row['State']].filter(Boolean).join(', '))}</div>
            </div>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function selectAll(val) {
      document.querySelectorAll('.sel').forEach(chk => chk.checked = val);
    }

    function selectedRows() {
      const cards = [...document.querySelectorAll('.rowcard')];
      return cards
        .map((card, idx) => ({ row: rows[idx], selected: card.querySelector('.sel').checked }))
        .filter(x => x.selected);
    }

    function renderPreviewRows() {
      const area = document.getElementById('previewArea');
      area.innerHTML = '';
      if (!campaignDataUrl || !rows.length) return;

      const limit = Math.min(rows.length, 2);
      for (let i = 0; i < limit; i++) {
        const poster = buildPoster(rows[i], campaignDataUrl);
        poster.style.transform = 'scale(0.25)';
        poster.style.transformOrigin = 'top left';
        poster.style.marginBottom = '-700px';
        const box = document.createElement('div');
        box.className = 'previewbox';
        box.appendChild(poster);
        area.appendChild(box);
      }
    }

    async function generateSelected() {
      if (!campaignDataUrl) {
        setStatus('Please upload the campaign image first.');
        return;
      }

      const targets = selectedRows();
      if (!targets.length) {
        setStatus('No branches selected.');
        return;
      }

      setStatus(`Generating ${targets.length} posters...`);
      for (let i = 0; i < targets.length; i++) {
        const row = targets[i].row;
        const poster = buildPoster(row, campaignDataUrl);

        const canvas = await html2canvas(poster, {
          useCORS: true,
          scale: 2,
          backgroundColor: '#ffffff'
        });

        const dataUrl = canvas.toDataURL('image/png');
        const fileName = sanitize(row['Dealership Name'] || `poster_${i + 1}`) + '.png';

        try {
          const resp = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'savePoster',
              dataUrl,
              fileName,
              mimeType: 'image/png',
              rowNumber: row.__rowNumber
            })
          });

          const text = await resp.text();
          let result;
          try {
            result = JSON.parse(text);
          } catch (e) {
            console.error('Non-JSON response:', text);
            throw new Error('Backend did not return JSON for savePoster');
          }

          if (!result.ok) throw new Error(result.error || 'Save failed');
        } catch (err) {
          console.error(err);
          setStatus('Save failed: ' + (err.message || err));
          return;
        }

        document.body.removeChild(poster);
        setStatus(`Generated ${i + 1} / ${targets.length} : ${row['Dealership Name'] || ''}`);
      }

      setStatus('Done. Files saved to Drive and URLs written back to the sheet.');
    }

    function buildPoster(row, bgUrl) {
      const gmb = String(row['GMB_URL'] || '').trim();
      const qrId = 'qr_' + Math.random().toString(36).slice(2);

      const el = document.createElement('div');
      el.className = 'poster';
      el.innerHTML = `
        <img src="${bgUrl}" alt="Campaign Artwork">
        <div class="footer">
          <div class="footer-left">
            <div class="dealer-name">${escapeHtml(row['Dealership Name'] || '')}</div>
            <div class="line">${escapeHtml(row['DSP Address'] || '')}</div>
            <div class="line">${escapeHtml([row['LOCATION'], row['City'], row['State']].filter(Boolean).join(', '))}</div>
            <div class="contact">Owner No: ${escapeHtml(row['Owner No'] || '')} | Alternate No: ${escapeHtml(row['Alternate no'] || '')}</div>
          </div>
          <div class="footer-right">
            <div id="${qrId}" class="qr-box"></div>
            <div class="qr-label">Scan to locate us</div>
          </div>
        </div>
      `;
      document.body.appendChild(el);

      const qrHost = el.querySelector('#' + qrId);
      if (gmb) {
        new QRCode(qrHost, {
          text: gmb,
          width: 116,
          height: 116,
          colorDark: '#000000',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.M
        });
      } else {
        qrHost.innerHTML = '<div style="font-size:12px;color:#777;padding-top:40px;">No link</div>';
      }

      el.style.position = 'fixed';
      el.style.left = '-99999px';
      el.style.top = '0';
      return el;
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onload = () => resolve(fr.result);
        fr.onerror = reject;
        fr.readAsDataURL(file);
      });
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function sanitize(name) {
      return String(name || '')
        .trim()
        .replace(/[\\\/:*?"<>|]+/g, '_')
        .replace(/\s+/g, '_')
        .substring(0, 120);
    }
  </script>
</body>
</html>
