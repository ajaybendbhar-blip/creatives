<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSP Poster Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #1a73e8;
      --border: #d7dbe7;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap { max-width: 1280px; margin: 0 auto; padding: 20px; }
    .panel {
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      margin-bottom: 18px;
    }
    h1 { margin: 0 0 8px 0; }
    .small { color: var(--muted); font-size: 13px; line-height: 1.5; }
    label { display:block; margin-top:10px; font-weight:700; font-size:14px; }
    input, textarea {
      width:100%; box-sizing:border-box; margin-top:6px; margin-bottom:12px;
      padding:10px; border:1px solid var(--border); border-radius:10px;
      font-size:14px; outline:none;
    }
    textarea { min-height: 90px; resize: vertical; }
    button {
      padding:12px 16px; border:0; border-radius:10px; background:var(--primary); color:#fff;
      font-weight:700; cursor:pointer; margin-right:8px; margin-top:4px;
    }
    button.secondary { background:#5f6368; }
    button:disabled { opacity:0.6; cursor:not-allowed; }
    .status { margin-top:12px; color:#0b57d0; font-size:14px; white-space:pre-wrap; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:16px; }
    .rowcard { border:1px solid #e5e7eb; border-radius:14px; padding:12px; background:#fff; }
    .rowtop { display:flex; align-items:flex-start; gap:10px; margin-bottom:10px; }
    .rowtitle { font-weight:800; font-size:16px; }
    .rowsub { font-size:13px; color:#6b7280; margin-top:2px; line-height:1.4; }

    .poster {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      background: #111;
      color: #000;
      border-radius: 14px;
      transform: scale(0.28);
      transform-origin: top left;
      margin-bottom: -972px;
    }
    .bg {
      position:absolute; inset:0;
      background-size:cover;
      background-position:center;
      filter:brightness(0.96);
    }
    .overlay {
      position:absolute; inset:0;
      background:linear-gradient(to bottom, rgba(255,255,255,0.00), rgba(255,255,255,0.00));
    }

    /* White dealer strip */
    .strip {
      position:absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 255px;
      background: #ffffff;
      color: #000000;
      border-top: 1px solid #e5e7eb;
      box-shadow: 0 -6px 20px rgba(0,0,0,0.10);
      padding: 20px 28px 18px 28px;
      box-sizing: border-box;
    }

    .dealer-name {
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 8px;
      line-height: 1.1;
      color: #000;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .line {
      font-size: 19px;
      line-height: 1.35;
      margin-bottom: 4px;
      color: #000;
    }

    .contact {
      margin-top: 8px;
      font-size: 18px;
      color: #000;
      line-height: 1.35;
    }

    .locate {
      margin-top: 6px;
      font-size: 18px;
      color: #000;
      line-height: 1.35;
      word-break: break-word;
    }

    .locate strong {
      font-weight: 800;
    }

    .copybox {
      position:absolute;
      top: 56px;
      left: 60px;
      right: 60px;
      font-size: 34px;
      line-height: 1.2;
      font-weight: 700;
      text-align: center;
      white-space: pre-wrap;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.35);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h1>DSP Poster Generator</h1>
      <div class="small">
        Upload one campaign image, select branches, then generate PNG posters.
        Each output is saved to Drive and the URL is written back to your sheet.
      </div>

      <label>Campaign Image</label>
      <input type="file" id="imageFile" accept="image/*" />

      <label>Approved Copy</label>
      <textarea id="approvedCopy" placeholder="Paste approved copy here"></textarea>

      <div style="margin-top:10px;">
        <button onclick="loadRows()">Load Branches</button>
        <button class="secondary" onclick="selectAll(true)">Select All</button>
        <button class="secondary" onclick="selectAll(false)">Clear All</button>
        <button onclick="generateSelected()">Generate Selected</button>
      </div>

      <div id="status" class="status"></div>
    </div>

    <div class="panel">
      <div id="branchList" class="grid"></div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxcM3hge5lSPhH2KiZPMOiD3YGbyHV5zb24Kw9CnyHNCV0M5zbPxBmIOZfX4DQwSy_8/exec';
    let rows = [];
    let campaignDataUrl = '';

    document.getElementById('imageFile').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      campaignDataUrl = await fileToDataUrl(file);
      setStatus('Campaign image loaded.');
    });

    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    async function loadRows() {
      try {
        setStatus('Loading branches from sheet...');
        const res = await fetch(SCRIPT_URL + '?action=getRows');
        const data = await res.json();
        rows = data.rows || [];
        renderRows();
        setStatus(`Loaded ${rows.length} branches.`);
      } catch (err) {
        setStatus('Error loading rows: ' + (err.message || err));
      }
    }

    function renderRows() {
      const list = document.getElementById('branchList');
      list.innerHTML = '';
      if (!rows.length) {
        list.innerHTML = '<div class="rowcard">No rows found.</div>';
        return;
      }

      rows.forEach((row, i) => {
        const card = document.createElement('div');
        card.className = 'rowcard';
        card.dataset.idx = i;
        card.innerHTML = `
          <div class="rowtop">
            <input type="checkbox" class="sel" checked>
            <div>
              <div class="rowtitle">${escapeHtml(row['Dealership Name'] || '')}</div>
              <div class="rowsub">${escapeHtml([row['DSP Address'], row['LOCATION'], row['City'], row['State']].filter(Boolean).join(', '))}</div>
            </div>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function selectAll(val) {
      document.querySelectorAll('.sel').forEach(chk => chk.checked = val);
    }

    function selectedRows() {
      const cards = [...document.querySelectorAll('.rowcard')];
      return cards
        .map((card, idx) => ({ row: rows[idx], selected: card.querySelector('.sel').checked }))
        .filter(x => x.selected);
    }

    async function generateSelected() {
      if (!campaignDataUrl) {
        setStatus('Please upload the campaign image first.');
        return;
      }
      const copy = document.getElementById('approvedCopy').value.trim();
      if (!copy) {
        setStatus('Please paste approved copy.');
        return;
      }

      const targets = selectedRows();
      if (!targets.length) {
        setStatus('No branches selected.');
        return;
      }

      setStatus(`Generating ${targets.length} posters...`);
      for (let i = 0; i < targets.length; i++) {
        const row = targets[i].row;
        const poster = buildPoster(row, campaignDataUrl, copy);
        const canvas = await html2canvas(poster, { useCORS: true, scale: 2, backgroundColor: null });
        const dataUrl = canvas.toDataURL('image/png');
        const fileName = sanitize(row['Dealership Name'] || `poster_${i + 1}`) + '.png';

        try {
          const resp = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'savePoster',
              dataUrl,
              fileName,
              mimeType: 'image/png',
              rowNumber: row.__rowNumber
            })
          });
          await resp.json();
        } catch (err) {
          console.error(err);
          setStatus('Save failed: ' + (err.message || err));
          return;
        }

        document.body.removeChild(poster);
        setStatus(`Generated ${i + 1} / ${targets.length} : ${row['Dealership Name'] || ''}`);
      }

      setStatus('Done. Files saved to Drive and URLs written back to the sheet.');
    }

    function buildPoster(row, bgUrl, copyText) {
      const el = document.createElement('div');
      el.className = 'poster';
      el.innerHTML = `
        <div class="bg" style="background-image:url('${bgUrl}')"></div>
        <div class="overlay"></div>
        <div class="copybox">${escapeHtml(copyText)}</div>
        <div class="strip">
          <div class="dealer-name">${escapeHtml(row['Dealership Name'] || '')}</div>
          <div class="line">${escapeHtml(row['DSP Address'] || '')}</div>
          <div class="line">${escapeHtml([row['LOCATION'], row['City'], row['State']].filter(Boolean).join(', '))}</div>
          <div class="contact">Owner No: ${escapeHtml(row['Owner No'] || '')} | Alternate No: ${escapeHtml(row['Alternate no'] || '')}</div>
          <div class="locate"><strong>Locate us:</strong> ${escapeHtml(row['GMB_URL'] || '')}</div>
        </div>
      `;
      document.body.appendChild(el);
      el.style.position = 'fixed';
      el.style.left = '-99999px';
      return el;
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onload = () => resolve(fr.result);
        fr.onerror = reject;
        fr.readAsDataURL(file);
      });
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function sanitize(name) {
      return String(name || '')
        .trim()
        .replace(/[\\\/:*?"<>|]+/g, '_')
        .replace(/\s+/g, '_')
        .substring(0, 120);
    }
  </script>
</body>
</html>
