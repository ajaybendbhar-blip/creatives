<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSP Poster Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #1a73e8;
      --border: #d7dbe7;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .panel {
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      margin-bottom: 18px;
    }
    h1 {
      margin: 0 0 10px 0;
    }
    .small {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: 700;
      font-size: 14px;
    }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      margin-top: 6px;
      margin-bottom: 12px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }
    textarea {
      min-height: 90px;
      resize: vertical;
    }
    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      margin-right: 8px;
      margin-top: 4px;
    }
    button.secondary {
      background: #5f6368;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status {
      margin-top: 12px;
      color: #0b57d0;
      font-size: 14px;
      white-space: pre-wrap;
    }
    #previewArea {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 18px;
    }
    .poster {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      background: #111;
      color: #fff;
      border-radius: 16px;
      transform: scale(0.28);
      transform-origin: top left;
      margin-bottom: -972px;
    }
    .bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: brightness(0.92);
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.12), rgba(0,0,0,0.68));
    }
    .copy {
      position: absolute;
      top: 60px;
      left: 60px;
      right: 60px;
      font-size: 34px;
      line-height: 1.2;
      font-weight: 700;
      text-align: center;
      white-space: pre-wrap;
    }
    .strip {
      position: absolute;
      left: 40px;
      right: 40px;
      bottom: 40px;
      background: rgba(0,0,0,0.80);
      border: 2px solid rgba(255,255,255,0.16);
      border-radius: 18px;
      padding: 28px;
    }
    .dealer-name {
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .line {
      font-size: 22px;
      line-height: 1.45;
      margin-bottom: 4px;
    }
    .contact, .gmb {
      margin-top: 8px;
      font-size: 18px;
      opacity: 0.92;
      word-break: break-word;
    }
    .row-count {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h1>DSP Poster Generator</h1>
      <div class="small">
        Paste your Apps Script web app URL, campaign image URL, and approved copy.
        Then load sheet rows, preview posters, and generate PNGs.
      </div>

      <label>Apps Script Web App URL</label>
      <input id="scriptUrl" value="https://script.google.com/macros/s/AKfycbzV-NKnZQawcN-crsk9hnplkl-OJNmiucfpgVZ_F2iJ24-oqdxLEEj0EEIrHtJSjSmE/exec" />

      <label>Campaign Image URL</label>
      <input id="imgUrl" placeholder="Paste public image URL" />

      <label>Approved Campaign Copy</label>
      <textarea id="copyText" placeholder="Paste approved campaign copy"></textarea>

      <button onclick="loadRows()">Load Rows</button>
      <button onclick="loadPreviews()">Preview Posters</button>
      <button onclick="generatePNGs()">Generate PNGs</button>
      <div id="status" class="status"></div>
      <div id="rowCount" class="row-count"></div>
    </div>

    <div id="previewArea"></div>
  </div>

  <script>
    let rows = [];

    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    function getScriptUrl() {
      return document.getElementById('scriptUrl').value.trim().replace(/\/$/, '');
    }

    async function loadRows() {
      const url = getScriptUrl();
      if (!url) {
        setStatus('Please paste the Apps Script web app URL.');
        return;
      }

      setStatus('Loading rows...');
      try {
        const res = await fetch(url + '?action=getRows', { method: 'GET' });
        const data = await res.json();
        rows = data.rows || [];
        document.getElementById('rowCount').textContent = `Loaded ${rows.length} rows.`;
        setStatus(`Loaded ${rows.length} rows.`);
        loadPreviews();
      } catch (err) {
        setStatus('Error loading rows: ' + err.message);
      }
    }

    function buildPoster(row) {
      const poster = document.createElement('div');
      poster.className = 'poster';

      const bg = document.createElement('div');
      bg.className = 'bg';
      bg.style.backgroundImage = `url('${document.getElementById('imgUrl').value.trim()}')`;
      poster.appendChild(bg);

      const overlay = document.createElement('div');
      overlay.className = 'overlay';
      poster.appendChild(overlay);

      const copy = document.createElement('div');
      copy.className = 'copy';
      copy.textContent = document.getElementById('copyText').value.trim();
      poster.appendChild(copy);

      const strip = document.createElement('div');
      strip.className = 'strip';
      strip.innerHTML = `
        <div class="dealer-name">${escapeHtml(row['Dealership Name'] || '')}</div>
        <div class="line">${escapeHtml(row['DSP Address'] || '')}</div>
        <div class="line">${escapeHtml(row['LOCATION'] || '')}, ${escapeHtml(row['City'] || '')}, ${escapeHtml(row['State'] || '')}</div>
        <div class="contact">Owner No: ${escapeHtml(row['Owner No'] || '')} | Alternate No: ${escapeHtml(row['Alternate no'] || '')}</div>
        <div class="gmb">GMB: ${escapeHtml(row['GMB_URL'] || '')}</div>
      `;
      poster.appendChild(strip);

      return poster;
    }

    function loadPreviews() {
      const area = document.getElementById('previewArea');
      area.innerHTML = '';

      if (!rows.length) {
        area.innerHTML = '<div class="panel">No rows loaded.</div>';
        return;
      }

      const limit = Math.min(rows.length, 6);
      for (let i = 0; i < limit; i++) {
        const card = document.createElement('div');
        card.className = 'panel';
        card.appendChild(buildPoster(rows[i]));
        area.appendChild(card);
      }
      setStatus(`Previewing ${limit} of ${rows.length} posters.`);
    }

    async function generatePNGs() {
      const url = getScriptUrl();
      const img = document.getElementById('imgUrl').value.trim();
      const copy = document.getElementById('copyText').value.trim();

      if (!url || !img || !copy) {
        setStatus('Please fill Apps Script URL, image URL, and approved copy.');
        return;
      }
      if (!rows.length) {
        setStatus('Load rows first.');
        return;
      }

      setStatus('Generating PNGs...');
      for (let i = 0; i < rows.length; i++) {
        const temp = document.createElement('div');
        temp.style.position = 'fixed';
        temp.style.left = '-99999px';
        temp.appendChild(buildPoster(rows[i]));
        document.body.appendChild(temp);

        const poster = temp.querySelector('.poster');
        const canvas = await html2canvas(poster, {
          useCORS: true,
          scale: 2,
          backgroundColor: null
        });

        const dataUrl = canvas.toDataURL('image/png');
        const fileName = sanitize(rows[i]['Dealership Name'] || ('poster_' + (i + 1))) + '.png';

        await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify({
            action: 'savePng',
            fileName: fileName,
            dataUrl: dataUrl
          })
        }).then(r => r.text());

        document.body.removeChild(temp);
        setStatus(`Generated ${i + 1} of ${rows.length}`);
      }

      setStatus('Done. PNGs saved to Drive.');
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function sanitize(name) {
      return String(name || '')
        .trim()
        .replace(/[\\\/:*?"<>|]+/g, '_')
        .replace(/\s+/g, '_')
        .substring(0, 120);
    }
  </script>
</body>
</html>
